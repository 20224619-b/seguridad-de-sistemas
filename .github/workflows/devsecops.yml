name: Pipeline DevSecOps (SAST y DAST)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write 

jobs:
  sast-semgrep:
    name: Fase 1 - SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Ejecutar escaneo SAST y Quality Gate
        
        run: |
          semgrep scan --config p/owasp-top-ten --config p/security-audit --config xss-rule.yaml --error --sarif -o semgrep.sarif routes frontend/src/app
      - name: Subir reporte SARIF a GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif

  dast-zap:
    name: Fase 3 y 4 - Build Efímero y DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: sast-semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Levantar OWASP Juice Shop efímero en Docker
        run: docker run -d --name juice-shop -p 3000:3000 bkimminich/juice-shop
      - name: Esperar a que la app esté lista
        run: sleep 15
      - name: Ejecutar escaneo OWASP ZAP Baseline
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:3000'
          fail_action: true 