name: Pipeline DevSecOps - SAST y DAST

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  security-events: write

jobs:
  sast-semgrep:
    name: Fase 1 - SAST (Semgrep R01 y R02)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Escanear SQLi y XSS (Quality Gate)
        run: |
          semgrep scan --config p/owasp-top-ten --config p/javascript --config p/typescript --config ./xss-rule.yaml --error --sarif -o semgrep.sarif routes frontend/src/app
      - name: Subir reporte SARIF a GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif