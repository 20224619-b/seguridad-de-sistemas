name: Pipeline DevSecOps - SAST y DAST

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  security-events: write

jobs:
  sast-semgrep:
    name: Fase 1 - SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Escanear SQLi y XSS (Quality Gate)
        run: |
          semgrep scan --config p/owasp-top-ten --config p/javascript --config p/typescript --config ./xss-rule.yaml --error --text --sarif -o semgrep.sarif routes frontend/src/app
      - name: Subir reporte SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif

  dast-zap:
    name: Fase 3 y 4 - Staging Efimero y DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: sast-semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen Docker
        run: docker build -t juice-shop-staging .
      - name: Levantar contenedor efimero
        run: docker run -d --name juice-shop -p 3000:3000 juice-shop-staging
      - name: Esperar arranque
        run: sleep 15
      - name: Escaneo dinamico OWASP ZAP
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:3000'
          fail_action: true